name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the local development toolchain. Every job
  # overrides it explicitly so the stable jobs really run current stable.
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - { name: default, flags: "" }
          - { name: all-features, flags: "--all-features" }
          - { name: no-default-features, flags: "--no-default-features" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets ${{ matrix.features.flags }}
      - name: Unit and integration tests
        run: cargo test --lib --tests ${{ matrix.features.flags }}
      - name: Doc tests
        run: cargo test --doc ${{ matrix.features.flags }}
      - name: Examples
        if: matrix.features.name != 'no-default-features'
        run: |
          cargo run --example basic
          cargo run --example threaded
          cargo run --example tokio_driver
          cargo run --example rayon_driver

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
      # docs.rs builds with all features. Without `std`, links to std-only
      # items cannot resolve, so only that lint is relaxed here.
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: "-D warnings -A rustdoc::broken_intra_doc_links"

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --all-features
          cargo build --no-default-features
      - name: Test
        run: cargo test --all-features

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # thumbv6m has no pointer-sized atomics: it exercises the
        # cfg(target_has_atomic = "ptr") fallbacks.
        target: [thumbv7em-none-eabihf, thumbv6m-none-eabi]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --no-default-features --target ${{ matrix.target }}

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --summary-only --fail-under-lines 90

  fuzz:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - batching_count
          - batching_bytes
          - try_map_continue
          - window_policies
          - policy_mix
          - reader_lines
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Prebuilt cargo-fuzz (install-action) is a static musl binary that defaults
      # --target to musl, where ASan cannot run; pin the glibc target explicitly.
      - name: Run ${{ matrix.target }} for 60 seconds
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60

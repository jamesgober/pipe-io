[package]
name = "pipe-io"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Typed source-transform-sink pipelines with bounded, backpressured stage edges, batching, windowing, and per-stage error isolation. A zero-dependency, in-process stream processor: the middle ground between raw iterators and distributed stream processing."

keywords = [
    "pipeline",
    "stream",
    "backpressure",
    "etl",
    "batching"
]

categories = [
    "concurrency",
    "data-structures",
    "no-std"
]

# Repository tooling that has no meaning inside a published package. The
# toolchain pin in particular must not leak into docs.rs or vendored builds.
exclude = [".github/", "rust-toolchain.toml"]

documentation = "https://docs.rs/pipe-io"
repository    = "https://github.com/jamesgober/pipe-io"
homepage      = "https://github.com/jamesgober/pipe-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

# No runtime dependencies. Everything below is used only by tests,
# benchmarks, and examples and is never part of a dependent's build.
[dev-dependencies]
# Property tests (tests/property.rs).
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Statistically sound benchmarks (benches/pipeline.rs); 0.7 is the newest
# line that supports the 1.85 MSRV.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# examples/tokio_driver.rs: driving pipelines from a tokio runtime.
tokio = { version = "1.44", default-features = false, features = ["rt-multi-thread", "time"] }
# examples/rayon_driver.rs: driving pipelines on a rayon pool.
rayon = "1.10"

[workspace]
exclude = ["fuzz"]

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "pipeline"
harness = false
required-features = ["std"]

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "batching"
required-features = ["std"]

[[example]]
name = "windowing"
required-features = ["std"]

[[example]]
name = "dead_letter"
required-features = ["std"]

[[example]]
name = "threaded"
required-features = ["std"]

[[example]]
name = "custom_driver"
required-features = ["std"]

[[example]]
name = "custom_source"
required-features = ["std"]

[[example]]
name = "etl"
required-features = ["std"]

[[example]]
name = "live_ingest"
required-features = ["std"]

[[example]]
name = "tokio_driver"
required-features = ["std"]

[[example]]
name = "rayon_driver"
required-features = ["std"]

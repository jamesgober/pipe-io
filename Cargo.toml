[package]
name = "pipe-io"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Typed source-transform-sink pipelines with backpressure, batching, windowing, and per-stage error isolation. A lightweight runtime-agnostic stream processor for in-process workloads. The missing middle ground between raw iterators and full distributed stream processing."

keywords = [
    "pipeline",
    "stream",
    "backpressure",
    "etl",
    "io"
]

categories = [
    "asynchronous",
    "data-structures",
    "concurrency"
]

documentation = "https://docs.rs/pipe-io"
repository    = "https://github.com/jamesgober/pipe-io"
homepage      = "https://github.com/jamesgober/pipe-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "pipeline"
harness = false
required-features = ["std"]

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "batching"
required-features = ["std"]

[[example]]
name = "windowing"
required-features = ["std"]

[[example]]
name = "dead_letter"
required-features = ["std"]

[[example]]
name = "threaded"
required-features = ["std"]

[[example]]
name = "custom_driver"
required-features = ["std"]

[[example]]
name = "custom_source"
required-features = ["std"]

[[example]]
name = "etl"
required-features = ["std"]

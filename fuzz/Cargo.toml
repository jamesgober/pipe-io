[package]
name = "pipe-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The harness code itself needs nothing newer than the crate's MSRV;
# building it requires a nightly toolchain because of libFuzzer.
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pipe-io = { path = ".." }

[[bin]]
name = "batching_count"
path = "fuzz_targets/batching_count.rs"
test = false
doc = false

[[bin]]
name = "batching_bytes"
path = "fuzz_targets/batching_bytes.rs"
test = false
doc = false

[[bin]]
name = "try_map_continue"
path = "fuzz_targets/try_map_continue.rs"
test = false
doc = false

[[bin]]
name = "window_policies"
path = "fuzz_targets/window_policies.rs"
test = false
doc = false

[[bin]]
name = "policy_mix"
path = "fuzz_targets/policy_mix.rs"
test = false
doc = false

[[bin]]
name = "reader_lines"
path = "fuzz_targets/reader_lines.rs"
test = false
doc = false

[workspace]
members = ["."]
